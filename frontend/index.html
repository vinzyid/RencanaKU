<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RencanaKU — Dari Ide Kasar Menjadi PRD yang Siap Dieksekusi</title>
    <link rel="icon" type="image/png" href="/logo/Logo Revisi Abyan Suka Warna Ungu.png" />
    <link rel="preload" as="image" href="/logo/Logo Revisi Abyan Suka Warna Ungu.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
        Splash pembuka. Ditulis inline (bukan di app.css / React) supaya tampil
        seketika, bahkan sebelum JavaScript & CSS aplikasi selesai dimuat, dan
        animasinya berjalan mulus di luar main thread selama halaman sibuk.
        Disembunyikan oleh src/react/utils/splash.js setelah aplikasi siap.
    -->
    <script>
        (function () {
            var root = document.documentElement;
            try {
                // Terapkan tema lebih awal agar splash & halaman tidak berkedip terang.
                if (localStorage.getItem('rencanaku_theme') === 'dark') root.classList.add('dark');
                // Animasi logo penuh saat pertama kali dibuka pada sesi ini;
                // saat muat ulang dipakai versi ringkas (lihat [data-splash='repeat']).
                if (sessionStorage.getItem('rencanaku_splash_seen')) root.setAttribute('data-splash', 'repeat');
                sessionStorage.setItem('rencanaku_splash_seen', '1');
            } catch (e) { /* penyimpanan diblokir: pakai animasi penuh */ }
        })();
    </script>
    <style>
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            background: #F8F9FD;
            color: #0F172A;
            font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            opacity: 1;
            transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        .dark #splash { background: #0B0D14; color: #FFFFFF; }
        #splash.is-leaving { opacity: 0; pointer-events: none; }

        .splash-brand { display: flex; align-items: center; gap: 14px; }
        .splash-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.92);
        }
        /* Logo baru dianimasikan setelah gambarnya benar-benar termuat. */
        .splash-logo.is-loaded { animation: splash-in 500ms cubic-bezier(0.23, 1, 0.32, 1) forwards; }
        .splash-name {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.02em;
            opacity: 0;
            transform: translateY(6px);
            animation: splash-in 500ms cubic-bezier(0.23, 1, 0.32, 1) 80ms forwards;
        }

        /* Bar tak-tentu: tanda bahwa halaman sedang memuat, bukan macet. */
        .splash-bar {
            position: relative;
            width: 160px;
            height: 3px;
            border-radius: 999px;
            overflow: hidden;
            background: rgba(91, 77, 246, 0.16);
            opacity: 0;
            animation: splash-fade 300ms cubic-bezier(0.23, 1, 0.32, 1) 160ms forwards;
        }
        .splash-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: inherit;
            background: #5B4DF6;
            transform: translateX(-100%);
            animation: splash-slide 1.1s linear infinite;
        }

        /* Muncul hanya bila memuat terasa lama, supaya pengguna tahu apa yang terjadi. */
        .splash-hint, .splash-reload {
            margin: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            font-size: 13px;
            color: #64748B;
            opacity: 0;
            visibility: hidden;
        }
        .dark .splash-hint, .dark .splash-reload { color: #94A3B8; }
        .splash-hint { animation: splash-reveal 300ms cubic-bezier(0.23, 1, 0.32, 1) 6s forwards; }
        .splash-reload { animation: splash-reveal 300ms cubic-bezier(0.23, 1, 0.32, 1) 20s forwards; }
        .splash-reload button {
            margin-left: 6px;
            padding: 0;
            border: 0;
            background: none;
            font: inherit;
            font-weight: 700;
            color: #5B4DF6;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Muat ulang dalam sesi yang sama: logo tetap tampil, tetapi versi
           ringkas — langsung memudar masuk tanpa pergeseran & tanpa jeda
           berurutan — supaya refresh tidak terasa lambat. */
        [data-splash='repeat'] .splash-logo,
        [data-splash='repeat'] .splash-logo.is-loaded,
        [data-splash='repeat'] .splash-name,
        [data-splash='repeat'] .splash-bar {
            transform: none;
            animation: splash-fade 200ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes splash-in { to { opacity: 1; transform: none; } }
        @keyframes splash-fade { to { opacity: 1; } }
        @keyframes splash-reveal { to { opacity: 1; visibility: visible; } }
        @keyframes splash-slide { to { transform: translateX(250%); } }

        /* Kurangi gerakan: pertahankan fade, hilangkan pergeseran & skala. */
        @media (prefers-reduced-motion: reduce) {
            .splash-logo, .splash-name { transform: none; }
            .splash-logo.is-loaded, .splash-name { animation-name: splash-fade; }
            .splash-bar::after {
                width: 100%;
                transform: none;
                animation: splash-pulse 1.6s ease-in-out infinite;
            }
            @keyframes splash-pulse { 50% { opacity: 0.35; } }
        }
    </style>
</head>
<body class="antialiased bg-[#F8F9FD] text-slate-800 selection:bg-indigo-500 selection:text-white">
    <div id="splash" role="status" aria-live="polite" aria-label="Memuat RencanaKU">
        <div class="splash-brand">
            <img class="splash-logo" src="/logo/Logo Revisi Abyan Suka Warna Ungu.png" alt="" width="56" height="56"
                 onload="this.classList.add('is-loaded')" />
            <span class="splash-name">RencanaKU</span>
        </div>
        <div class="splash-bar" aria-hidden="true"></div>
        <p class="splash-hint">Masih memuat… koneksi sedang lambat, mohon tunggu sebentar.</p>
        <p class="splash-reload">Terlalu lama?<button type="button" onclick="location.reload()">Muat ulang halaman</button></p>
    </div>
    <noscript>
        <style>#splash { display: none; }</style>
        <p style="padding: 24px; font-family: system-ui, sans-serif;">RencanaKU membutuhkan JavaScript. Aktifkan JavaScript di browser Anda lalu muat ulang halaman.</p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
