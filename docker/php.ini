; Konfigurasi PHP produksi RencanaKU.

; Panggilan AI dikerjakan worker antrean (bukan request HTTP), tapi ekspor PDF
; (dompdf) dan pemanggilan API luar tetap butuh ruang di atas bawaan.
memory_limit = 256M
max_execution_time = 60
default_socket_timeout = 90

upload_max_filesize = 4M
post_max_size = 8M

; Fitur progres unggahan tidak dipakai; dimatikan untuk memperkecil permukaan serangan.
session.upload_progress.enabled = 0

display_errors = Off
log_errors = On
expose_php = Off

date.timezone = Asia/Jakarta

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
