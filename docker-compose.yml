# Docker Compose RencanaKU.
#
# Di VPS: container web mendengarkan 127.0.0.1:8082, lalu Caddy di host meneruskan
# https://rencanaku.biz.id ke sana. Port 8080 (LexiScan) dan 8081 (VinzyPlay)
# sudah terpakai di VPS yang sama, jadi jangan diubah ke port itu.
#
# Tiga container dari image yang sama:
#   web       -> SPA React + API Laravel (FrankenPHP)
#   queue     -> memproses pesan chat dengan AI (job ProcessProjectMessage)
#   scheduler -> tugas terjadwal (hapus token login kedaluwarsa tiap hari)
#
# Database ada di Supabase (cloud). Di VPS hanya volume storage (sesi, cache, log).

x-app: &app
  image: rencanaku:latest
  restart: unless-stopped
  env_file:
    - .env.production
  volumes:
    - storage:/app/storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  web:
    <<: *app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rencanaku-web
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  queue:
    <<: *app
    container_name: rencanaku-queue
    pull_policy: never
    healthcheck:
      disable: true
    # Job AI boleh jalan sampai 300 detik; timeout worker sedikit di atasnya.
    command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=310", "--max-time=3600", "--sleep=2"]
    depends_on:
      web:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: rencanaku-scheduler
    pull_policy: never
    healthcheck:
      disable: true
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  storage:
